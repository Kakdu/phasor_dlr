[project]
name = "phasor-dlr"
version = "0.1.0"
description = "Code for analysing phasor-based DLR performance through error propagation, inference and variance decomposition."
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.14"
dependencies = [
    "numpy (>=2.4.1,<3.0.0)",
    "scipy (>=1.17.0,<2.0.0)",
    "arviz (>=0.23.1,<0.24.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "dataclasses (>=0.8,<0.9)",
    "pymc (>=5.27.0,<6.0.0)",
    "multiprocessing (>=2.6.2.1,<3.0.0.0)",
    "argparse (>=1.4.0,<2.0.0)",
    "pytensor (>=2.36.3,<3.0.0)",
    "salib (>=1.5.2,<2.0.0)",
    "datetime (>=6.0,<7.0)",
    "seaborn (>=0.13.2,<0.14.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
